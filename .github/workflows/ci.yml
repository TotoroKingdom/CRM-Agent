name: CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync backend
        run: uv sync --project apps/api --python 3.12
      - name: Ruff format
        run: uv run --project apps/api ruff format --check apps/api
      - name: Ruff lint
        run: uv run --project apps/api ruff check apps/api
      - name: Pytest
        run: uv run --project apps/api pytest apps/api/tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
      - run: uv python install 3.12
      - run: uv sync --project apps/api --python 3.12
      - run: uv run --project apps/api python -m app.scripts.export_openapi
      - run: npm ci
        working-directory: apps/web
      - run: npm run generate:api
        working-directory: apps/web
      - name: Verify generated contract is committed
        run: git diff --exit-code -- apps/api/openapi.json apps/web/src/generated/api.ts
